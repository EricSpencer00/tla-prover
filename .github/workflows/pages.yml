name: Publish research hub

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Publish from the dedicated aisec-102 runner; GitHub only schedules the job.
    runs-on: [self-hosted, linux, x64, aisec-102, tla-prover]
    steps:
      - uses: actions/checkout@v4
      - name: Verify static site
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          ! grep -RInE '(api[_-]?key|BEGIN [A-Z ]+PRIVATE KEY)' site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
