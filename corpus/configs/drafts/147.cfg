\* Draft TLC config for spec 147.tla (module MCNano) - confidence: HIGH
\* Mirrors upstream tlaplus/examples MCNanoSmall.cfg: Nano's NoHash/NoBlock
\* are unbounded CHOOSEs, overridden inside the instantiated Nano module by
\* the NoHashVal/NoBlockVal model values; VIEW View ignores hash order.
SPECIFICATION Spec
CONSTANTS
  Hash = {h1, h2, h3}
  NoHashVal = NoHashVal
  PrivateKey = {pk1, pk2}
  PublicKey = {pub1, pub2}
  Node = {n1, n2}
  GenesisBalance = 3
  NoBlockVal = NoBlockVal
  CalculateHash <- CalculateHashImpl
  NoHash = [Nano]NoHashVal
  NoBlock = [Nano]NoBlockVal
VIEW View
INVARIANTS TypeInvariant SafetyInvariant
