\* Draft TLC config for spec 121.tla (module LeastCircularSubstring) - confidence: MED
\* (PlusCal translation)
\* Corpus == ZSeq(CharacterSet) is infinite because ZSequences takes sequence
\* lengths from Nat (a LOCAL INSTANCE, so a global Nat override does not reach
\* it). Upstream bounds it with the module-scoped override
\* Nat <- [ZSequences]ZSeqNat, but ZSeqNat is only defined in the
\* MCLeastCircularSubstring wrapper (spec 122). Here the only in-scope finite
\* set of naturals is the CharacterSet constant itself, which doubles as a
\* legitimate length bound (strings of length <= 2).
SPECIFICATION Spec
CONSTANTS
  CharacterSet = {0, 1, 2}
  Nat <- [ZSequences]CharacterSet
INVARIANTS TypeInvariant Correctness
