\* Hand-authored (see corpus/configs/wrappers/MC_HanoiSeq.tla). NotSolved is
\* deliberately excluded: the module's own idiom is to INVARIANT-check it and
\* expect TLC to report a violation (that "violation" is the found solution,
\* i.e. the counterexample trace IS the puzzle's solution) -- not a real
\* safety property, and our harness classifies any invariant violation as a
\* failure, so including it here would misreport a working spec as broken.
CONSTANTS
  A <- AConst
  B <- BConst
  C <- CConst
INIT Init
NEXT Next
INVARIANTS TypeOK NoNewElements TotalConstant
