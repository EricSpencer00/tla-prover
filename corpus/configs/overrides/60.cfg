\* Copied from upstream original cfg, ALIAS stanza removed -- this build
\* of tla2tools.jar does not support the ALIAS cfg keyword (confirmed:
\* -help does not list it; without it, TLC parses fine and explores real
\* states). ALIAS is purely cosmetic (error-trace pretty-printing per the
\* modules own Alias == comment), does not affect what gets verified.
CONSTANTS
    L = L
    P1 = P1
    P2 = P2
    P3 = P3
    P4 = P4
    P5 = P5

CONSTANT
    Procs <- NodesOfNetwork

CONSTANT
    Edges <- Network

CONSTANT
    Leader <- L

SPECIFICATION
    Spec

INVARIANT
    TypeOK
    DT1Inv
    InterestingBehavior

PROPERTY
    DT2
    \* CountersConsistent
    \* TreeWithRoot
    \* StableUpEdge


CHECK_DEADLOCK
    FALSE

ACTION_CONSTRAINT
    NoSuperfluousIdleSteps

