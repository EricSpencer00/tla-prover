\* Reuses spec 146's MultiPaxos_MC wrapper (TypeOK/Linearizability; MultiPaxos
\* itself defines no invariant/property of its own). Uses spec 145's own
\* draft constants (smaller Writes set than spec 146's, worth trying since
\* spec 146 itself is confirmed genuinely large -- see policy.json).
SPECIFICATION
    Spec
CONSTANTS
    Replicas = {r1, r2, r3}
    Writes = {w1}
    Reads = {rd1}
    MaxBallot <- ConstMaxBallot
SYMMETRY
    SymmetricPerms
INVARIANTS
    TypeOK
    Linearizability
CHECK_DEADLOCK
    FALSE
