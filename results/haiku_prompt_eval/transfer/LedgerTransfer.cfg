\* Configuration for LedgerTransfer model checker

\* Define the set of accounts (finite set for model checking)
CONSTANT ACCOUNTS = {alice, bob, charlie}

\* Starting amount for each account
CONSTANT INITIAL_BALANCE = 100

\* Maximum transfer amount per transaction
CONSTANT MAX_TRANSFER = 50

\* The specification to check
SPECIFICATION Spec

\* Invariants to verify
INVARIANT TypeOK
INVARIANT NoNegativeBalance
INVARIANT MoneyConserved
INVARIANT InitialStateValid
